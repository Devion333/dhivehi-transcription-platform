services:
  frontend:
    build:
      context: ./frontend/transcription-frontend
      dockerfile: Dockerfile
    container_name: transcript_frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "80:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    container_name: transcript_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: transcript_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_network

  minio:
    image: minio/minio:latest
    container_name: transcript_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: transcript_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcript_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}

      QDRANT_HOST: http://qdrant:6333

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      SESSION_SECURE: ${SESSION_SECURE}

      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}

      EXPECTED_WORKERS: ${EXPECTED_WORKERS}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS}

      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - app_network

  gradio_convert:
    build: ./gradio/convert
    container_name: transcript_gradio_convert
    restart: on-failure:5
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DAGSTER_ENABLED: "false"
      WORKER_INSTANCE_ID: conversion
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS}
    depends_on:
      - redis
      - minio
    networks:
      - app_network

  gradio_diarization:
    build: ./gradio/diarization
    container_name: transcript_gradio_diarization
    command: ["python", "-u", "diarization.py"]
    restart: on-failure:5
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: http://qdrant:6333
      QDRANT_COLLECTION: file_metadata
      HUGGINGFACE_ACCESS_TOKEN: ${HUGGINGFACE_ACCESS_TOKEN}
      DAGSTER_ENABLED: "false"
      WORKER_INSTANCE_ID: diarization
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - diarization_outputs:/app/outputs
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - qdrant
    networks:
      - app_network

  gradio_transcription:
    build:
      context: ./gradio/transcription
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: http://qdrant:6333
      QDRANT_COLLECTION: file_metadata

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      HUGGINGFACE_ACCESS_TOKEN: ${HUGGINGFACE_ACCESS_TOKEN}
      HF_TOKEN: ${HUGGINGFACE_ACCESS_TOKEN}

      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface

      WORKER_INSTANCE_ID: transcription
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - qdrant
      - minio
    networks:
      - app_network

  analysis:
    build: ./gradio/analysis
    container_name: transcript_analysis
    restart: on-failure:5
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_INSTANCE_ID: analysis
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS}
    depends_on:
      - redis
    networks:
      - app_network

  

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  hf_cache:
  transcription_models:
  diarization_outputs:
  huggingface_cache:
